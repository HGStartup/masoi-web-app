<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Export Emoji to PNG</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #1a1a2e; color: #fff; font-family: sans-serif; padding: 24px; }
    h1 { text-align: center; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #aaa; margin-bottom: 24px; }
    .role-section { background: #16213e; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
    .role-title { font-size: 18px; font-weight: bold; margin-bottom: 12px; }
    .emoji-options { display: flex; flex-wrap: wrap; gap: 16px; }
    .emoji-option { position: relative; cursor: pointer; text-align: center; }
    .emoji-option canvas { display: block; border-radius: 50%; border: 3px solid transparent; transition: border-color 0.2s; }
    .emoji-option.selected canvas { border-color: #7c3aed; box-shadow: 0 0 12px rgba(124,58,237,0.5); }
    .emoji-option .label { font-size: 12px; margin-top: 4px; color: #aaa; }
    .emoji-option .check { position: absolute; top: -4px; right: -4px; width: 24px; height: 24px; background: #7c3aed; border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 14px; }
    .emoji-option.selected .check { display: flex; }
    .actions { text-align: center; margin-top: 24px; }
    .actions button { padding: 14px 40px; background: #7c3aed; color: #fff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; }
    .actions button:hover { background: #6d28d9; }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Emoji → PNG Icon Export</h1>
  <p class="subtitle">Chọn 1 emoji cho mỗi vai trò, rồi nhấn tải.</p>
  <div id="roles"></div>
  <div class="actions">
    <button id="downloadAll">⬇ Tải tất cả đã chọn</button>
  </div>

  <script>
    const roles = [
      {
        name: 'wolf', label: 'Sói', bg: '#1a1028',
        options: ['🐺', '🐾', '🌑', '👹', '😈']
      },
      {
        name: 'villager', label: 'Dân làng', bg: '#1a2010',
        options: ['🌾', '🏡', '👒', '🧑‍🌾', '👤', '🏘️', '🌿']
      },
      {
        name: 'seer', label: 'Tiên tri', bg: '#1a1044',
        options: ['🔮', '👁️', '🌙', '✨', '🪬', '👁️‍🗨️']
      },
      {
        name: 'doctor', label: 'Bác sĩ', bg: '#102838',
        options: ['🩺', '💊', '🏥', '❤️‍🩹', '⚕️', '🩹', '💉']
      },
      {
        name: 'witch', label: 'Phù thủy', bg: '#2a1840',
        options: ['⚗️', '🧪', '🪄', '🧹', '🧙‍♀️', '☠️', '🍵']
      },
      {
        name: 'hunter', label: 'Thợ săn', bg: '#33250e',
        options: ['🏹', '🎯', '🔫', '🪓', '🗡️', '⚔️', '🦌', '🪤', '🐗', '🦅', '🏕️', '🌲', '🛡️']
      },
    ];

    const SIZE = 128;
    const EXPORT_SIZE = 256;
    const selected = {};

    // Default: first option for each role
    roles.forEach(r => { selected[r.name] = r.options[0]; });

    function renderEmoji(emoji, bg, size) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      ctx.fillStyle = bg;
      ctx.fill();
      ctx.font = `${size * 0.55}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(emoji, size / 2, size / 2 + size * 0.03);
      return canvas;
    }

    function buildUI() {
      const container = document.getElementById('roles');
      container.innerHTML = '';

      roles.forEach(role => {
        const section = document.createElement('div');
        section.className = 'role-section';

        const title = document.createElement('div');
        title.className = 'role-title';
        title.textContent = `${role.label} (${role.name})`;
        section.appendChild(title);

        const optionsDiv = document.createElement('div');
        optionsDiv.className = 'emoji-options';

        role.options.forEach(emoji => {
          const opt = document.createElement('div');
          opt.className = 'emoji-option' + (selected[role.name] === emoji ? ' selected' : '');

          const canvas = renderEmoji(emoji, role.bg, SIZE);
          opt.appendChild(canvas);

          const check = document.createElement('div');
          check.className = 'check';
          check.textContent = '✓';
          opt.appendChild(check);

          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = emoji;
          opt.appendChild(label);

          opt.onclick = () => {
            selected[role.name] = emoji;
            // Update selection UI for this role
            optionsDiv.querySelectorAll('.emoji-option').forEach(el => el.classList.remove('selected'));
            opt.classList.add('selected');
          };

          optionsDiv.appendChild(opt);
        });

        section.appendChild(optionsDiv);
        container.appendChild(section);
      });
    }

    function download(canvas, name) {
      const a = document.createElement('a');
      a.download = name + '.png';
      a.href = canvas.toDataURL('image/png');
      a.click();
    }

    document.getElementById('downloadAll').onclick = () => {
      roles.forEach(role => {
        const emoji = selected[role.name];
        const canvas = renderEmoji(emoji, role.bg, EXPORT_SIZE);
        download(canvas, role.name);
      });
    };

    buildUI();
  </script>
</body>
</html>
